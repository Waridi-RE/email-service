# .github/workflows/deploy.yml
name: Email Service CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  continuous-integration:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-with: '24'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run Linters & Tests
      run: |
        npm run lint --if-present
        npm test --if-present

  continuous-deployment:
    needs: continuous-integration
    runs-on: ubuntu-latest

    steps:
    - name: Deploy to Server via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        port: 22
        script: |
          export PATH=$PATH:/usr/bin:/usr/local/bin:/root/.nvm/versions/node/$(node -v)/bin

          cd /root/emailservice
          
          # 2. Use GitHub's internal auth token to pull from your PRIVATE repository securely
          if [ ! -d ".git" ]; then
            git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
          else
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git pull origin main
          fi
          
          /root/.nvm/versions/node/v24.0.0/bin/npm install --production --legacy-peer-deps
          
          # Try running pm2 via absolute npx fallback if global paths are misconfigured
          /root/.nvm/versions/node/v24.0.0/bin/pm2 reload ecosystem.config.js --env production || /root/.nvm/versions/node/v24.0.0/bin/pm2 start index.js --name "node-backend"
          